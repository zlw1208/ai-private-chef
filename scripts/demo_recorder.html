<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>AI 私厨 README 视频生成器</title>
<style>
  body { margin: 0; display: grid; min-height: 100vh; place-items: center; background: #17251f; color: white; font: 16px system-ui; }
  canvas { width: min(92vw, 1280px); box-shadow: 0 30px 90px #0006; }
  #status { position: fixed; bottom: 18px; }
</style>
<canvas id="stage" width="1280" height="720"></canvas>
<div id="status">正在准备素材…</div>
<script>
const canvas = document.querySelector('#stage');
const ctx = canvas.getContext('2d');
const status = document.querySelector('#status');
const sources = [
  ['/docs/demo/product-overview.png', '01 · 多模态食材识别'],
  ['/docs/demo/architecture.png', '02 · LangGraph 工具决策与数据链路'],
  ['/docs/demo/observability.png', '03 · LangSmith 可观测与 PostgreSQL 记忆'],
  ['/docs/demo/ai-private-chef-demo.gif', '04 · NDJSON 流式菜谱生成'],
];

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = src;
  });
}

function cover(image) {
  const scale = Math.max(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
  const width = image.naturalWidth * scale;
  const height = image.naturalHeight * scale;
  ctx.drawImage(image, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
}

Promise.all(sources.map(async ([src, label]) => [await loadImage(src), label])).then(async items => {
  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 5000000 });
  const chunks = [];
  recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
  recorder.onstop = async () => {
    status.textContent = '正在保存视频…';
    const blob = new Blob(chunks, { type: 'video/webm' });
    const response = await fetch('/save-video', { method: 'POST', headers: { 'Content-Type': 'video/webm' }, body: blob });
    status.textContent = response.ok ? `完成：${(blob.size / 1024 / 1024).toFixed(2)} MB` : '保存失败';
    document.title = response.ok ? 'VIDEO_READY' : 'VIDEO_FAILED';
  };

  recorder.start(1000);
  const started = performance.now();
  const duration = 21000;
  function render(now) {
    const elapsed = Math.max(0, Math.min(duration, now - started));
    const sceneLength = duration / items.length;
    const index = Math.min(items.length - 1, Math.floor(elapsed / sceneLength));
    const [image, label] = items[index];
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    cover(image);
    ctx.fillStyle = 'rgba(23,37,31,.88)';
    ctx.fillRect(0, 0, canvas.width, 58);
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 22px Microsoft YaHei, sans-serif';
    ctx.fillText(label, 32, 38);
    ctx.fillStyle = '#ef6a45';
    ctx.fillRect(0, 0, canvas.width * elapsed / duration, 7);
    status.textContent = `录制中 ${Math.round(elapsed / duration * 100)}%`;
    if (elapsed < duration) requestAnimationFrame(render);
    else recorder.stop();
  }
  requestAnimationFrame(render);
});
</script>
</html>
