[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-private-chef"
version = "0.1.0"
description = "A multimodal AI private chef built with FastAPI, LangChain, and LangGraph."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-tavily>=0.2,<1.0",
    "langgraph>=1.2.12,<1.3",
    "langgraph-checkpoint>=4.2,<5.0",
    "langgraph-prebuilt>=1.1,<1.2",
    "langgraph-sdk>=0.4.5,<0.5",
]
sqlite = [
    "aiosqlite>=0.20,<1.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
]
postgres = [
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
]
oss = [
    "alibabacloud-oss-v2>=1.1,<2.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
